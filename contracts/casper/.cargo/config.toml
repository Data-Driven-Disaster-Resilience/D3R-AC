[target.wasm32-unknown-unknown]
# casper-contract's ext_ffi.rs declares the Casper host functions
# (casper_read_value, casper_write, casper_dictionary_put, etc.) as plain
# `extern "C"` blocks -- by design, these stay unresolved at build time
# and get satisfied by the Casper runtime's host import object at deploy/
# execution, the same pattern used across WASM smart-contract ecosystems
# generally (not casper-specific). wasm-ld's default treats any
# unresolved symbol as a hard link error unless told otherwise;
# --allow-undefined is what tells it these particular ones are
# legitimate WASM imports, not missing code.
#
# target-feature=-bulk-memory: Casper's execution engine validates
# deployed Wasm against a restricted feature set for determinism/
# security reasons, and rejects "bulk memory operations" (the
# memory.copy/memory.fill instructions) -- confirmed via a real
# local-network test failure:
#   WasmPreprocessing(Deserialize("Bulk memory operations are not
#   supported"))
# Rust's default codegen for wasm32-unknown-unknown can emit these for
# larger memory copies (e.g. via the allocator, or LLVM's own optimizer,
# especially under LTO) unless explicitly disabled.
rustflags = ["-C", "link-args=--allow-undefined", "-C", "target-feature=-bulk-memory"]
