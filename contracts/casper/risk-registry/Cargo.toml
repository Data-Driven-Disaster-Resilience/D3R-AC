[package]
name = "risk-registry"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "risk-registry"
path = "src/main.rs"
bench = false
doctest = false
test = false

[dependencies]
# default-features = false: casper-contract's default feature set includes
# "no-std-helpers", which pulls in wee_alloc as the global allocator.
# wee_alloc is unmaintained (GHSA-rc23-xxgq-x27g, flagged critical by
# Dependabot) and its own handler module additionally requires nightly
# Rust (`#![feature(alloc_error_handler, core_intrinsics, lang_items)]`,
# gated behind that same feature) -- incompatible with this project's CI,
# which installs the *stable* toolchain (dtolnay/rust-toolchain@stable).
# main.rs supplies its own global allocator (dlmalloc) and panic handler
# instead, both stable-Rust-compatible.
casper-contract = { version = "5.1.1", default-features = false }
# casper-contract 5.1.1 requires casper-types ^6.0.1 (confirmed via
# crates.io's own dependency listing) -- NOT 7.0.0, despite that being
# the version this project's own prior notes said was pinned. Using
# 7.0.0 directly caused two incompatible casper-types versions (6.1.0
# and 7.0.0) in the same dependency graph, which surfaced as "expected
# EntryPoints, found casper_types::EntryPoints" -- structurally
# identical types from different crate versions are still different
# types to the compiler. 6.1.0 is the newest version actually
# compatible with casper-contract 5.1.1.
casper-types = "6.1.0"
casper-event-standard = "0.7.0"
# Global allocator for the no_std/wasm32 build (see casper-contract note
# above). Maintained under the rust-lang org -- it's the same allocator
# rustc's own std uses internally for the wasm32-unknown-unknown target
# -- and stable-Rust compatible (implements the stable GlobalAlloc trait,
# no unstable attributes required), unlike casper-contract's own
# no-std-helpers handlers.
dlmalloc = { version = "0.2.14", features = ["global"] }

[dev-dependencies]
# casper-execution-engine deliberately not listed here yet: no test
# files exist in this package yet (see contracts/casper/README.md's
# status list), and its current version pulls in casper-storage ->
# casper-types 7.0.0 transitively, conflicting with the 6.1.0 this
# package's actual dependencies need (casper-contract 5.1.1 requires
# casper-types ^6.0.1). Add it back, version-aligned, when real test
# code needs it.
casper-engine-test-support = "8.1.1"
