[package]
name = "d3rac-token"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "d3rac-token"
path = "src/main.rs"
bench = false
doctest = false
test = false

[dependencies]
# See risk-registry/Cargo.toml for the full rationale on every choice
# below -- identical reasoning applies here (same workspace, same
# target, same constraints), not re-derived per package.
casper-contract = { version = "5.1.1", default-features = false }
casper-types = "6.1.0"
casper-event-standard = "0.7.0"
dlmalloc = { version = "0.2.14", features = ["global"] }

# No [dev-dependencies]/tests here deliberately -- same reasoning as
# risk-registry/Cargo.toml: this package's `[[bin]]` is `#![no_std]`
# with its own `#[panic_handler]`, built only for
# wasm32-unknown-unknown. Integration tests live in the separate
# `d3rac-token-tests` workspace package instead.
