[package]
name = "disbursement-controller"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "disbursement-controller"
path = "src/main.rs"
bench = false
doctest = false
test = false

[dependencies]
# See risk-registry/Cargo.toml for the full rationale on every choice
# below -- same workspace, same target, same constraints.
casper-contract = { version = "5.1.1", default-features = false }
casper-types = "6.1.0"
casper-event-standard = "0.7.0"
dlmalloc = { version = "0.2.14", features = ["global"] }
