[package]
name = "funding-request-registry"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "funding-request-registry"
path = "src/main.rs"
bench = false
doctest = false
test = false

[dependencies]
# Same wee_alloc-avoidance reasoning as risk-registry/Cargo.toml -- see
# that file's comment for the full explanation. Not re-derived here.
casper-contract = { version = "5.1.1", default-features = false }
casper-types = "6.1.0"
casper-event-standard = "0.7.0"
dlmalloc = { version = "0.2.14", features = ["global"] }

# No [dev-dependencies]/tests here -- same native-vs-wasm32 target
# collision reasoning as risk-registry/Cargo.toml. Integration tests
# belong in a separate funding-request-registry-tests package once
# written (not yet -- see this contract's own top-of-file doc comment).
