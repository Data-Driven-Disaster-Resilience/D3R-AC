name: agents-ci

on:
  push:
    paths:
      - "agents/**"
  pull_request:
    paths:
      - "agents/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Validate + generate manifest
        run: |
          pip install pyyaml jsonschema
          python3 scripts/build_manifest.py

      - name: Install + build python package
        run: pip install -e ./python[dev]

      - name: Install + build node workspace
        run: cd node && npm install && npm run build

      - name: Test python agents
        run: cd python && pytest -q

      - name: Test node agents
        run: cd node && npm test

      - name: Smoke test full pipeline (file bus)
        run: |
          python3 -m d3rac_agents.cli run-all
          cd node && npm run start -- run-all
