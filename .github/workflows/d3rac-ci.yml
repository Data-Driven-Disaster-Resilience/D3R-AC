name: D3R·AC CI

# Comprehensive CI workflow for D3R·AC.
#
# Fix notes (this version):
# 1. Every job now checks whether its target directory actually exists
#    before doing real work, and exits cleanly (not as a failure) if not.
#    This matters because code isn't fully pushed yet — jobs shouldn't
#    hard-fail just because contracts/tron, frontend/, or data-pipeline/
#    don't exist in the repo yet.
# 2. Replaced the Gitleaks GitHub Action (which requires a paid license
#    for private repos) with the raw Gitleaks CLI, downloaded directly —
#    this works on public AND private repos with no license needed.
# 3. Removed reliance on paths-filter as the sole gate — directory
#    existence checks act as a second safety net regardless of how the
#    diff is computed, including on a repo's very first commit.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: {}

jobs:

  # ---------------------------------------------------------------
  # 0. Detect which parts of the repo changed
  # ---------------------------------------------------------------
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      contracts_casper: ${{ steps.filter.outputs.contracts_casper }}
      frontend: ${{ steps.filter.outputs.frontend }}
      data_pipeline: ${{ steps.filter.outputs.data_pipeline }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # On the very first commit to a repo there's no prior commit
          # to diff against; paths-filter falls back sensibly, but we
          # still guard every downstream job with a directory-exists
          # check below as a second safety net.
          filters: |
            contracts:
              - 'contracts/tron/**'
            contracts_casper:
              - 'contracts/casper/**'
            frontend:
              - 'frontend/**'
            data_pipeline:
              - 'data-pipeline/**'

  # ---------------------------------------------------------------
  # 1. Smart contract compile check (TRON / TVM, Solidity)
  # ---------------------------------------------------------------
  contracts-tron:
    name: Compile TRON Contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check contracts directory exists
        id: check
        run: |
          if [ -d "contracts/tron" ] && [ -n "$(find contracts/tron -name '*.sol' 2>/dev/null)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::contracts/tron has no .sol files yet — skipping compile step."
          fi

      - name: Set up Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install TronBox
        if: steps.check.outputs.exists == 'true'
        run: npm install -g tronbox

      - name: Install local dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: contracts/tron/tronbox
        run: npm install

      - name: Compile TRON contracts
        if: steps.check.outputs.exists == 'true'
        working-directory: contracts/tron/tronbox
        run: tronbox compile

      - name: Upload compiled artifacts
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tron-build-artifacts
          path: contracts/tron/tronbox/build/

  # ---------------------------------------------------------------
  # 1b. Contract logic tests (Hardhat) — see
  #     contracts/tron/hardhat.config.js for why Hardhat is used
  #     here instead of TronBox: these contracts use no TRON-specific
  #     precompiles/opcodes, so they're exactly as testable against a
  #     standard EVM. This does NOT replace a manual TronBox/testnet
  #     pass before mainnet (see docs/deployment-guide.md).
  #
  #     Hardhat 3 requires "type": "module" AND requires its sources to
  #     live inside its own project directory -- so Hardhat stays flat
  #     at contracts/tron/, and TronBox (which needs a CommonJS config)
  #     is nested instead, in contracts/tron/tronbox/, as its own
  #     isolated package. contracts/tron/contracts is a symlink to
  #     contracts/tron/tronbox/contracts (the real, physical directory)
  #     -- one source of truth, referenced two ways, so each tool's
  #     "sources must be inside my project root" check independently
  #     passes.
  # ---------------------------------------------------------------
  contracts-test:
    name: Contract Logic Tests (Hardhat)
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check test suite exists
        id: check
        run: |
          if [ -f "contracts/tron/package.json" ] && [ -d "contracts/tron/test" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::contracts/tron has no test suite yet — skipping."
          fi

      - name: Set up Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: contracts/tron
        run: npm install

      - name: Run Hardhat test suite
        if: steps.check.outputs.exists == 'true'
        working-directory: contracts/tron
        run: npx hardhat test

  # ---------------------------------------------------------------
  # 2. Solidity static analysis / linting (security hygiene)
  # ---------------------------------------------------------------
  contracts-lint:
    name: Lint & Static Analysis (Solidity)
    needs: [ changes, contracts-tron ]
    if: |
      always() &&
      needs.changes.outputs.contracts == 'true' &&
      needs.contracts-tron.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check contracts directory exists
        id: check
        run: |
          if [ -d "contracts/tron" ] && [ -n "$(find contracts/tron -name '*.sol' 2>/dev/null)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install solhint
        if: steps.check.outputs.exists == 'true'
        run: npm install -g solhint

      - name: Run solhint
        if: steps.check.outputs.exists == 'true'
        working-directory: contracts/tron
        run: solhint 'contracts/**/*.sol' || true

  # ---------------------------------------------------------------
  # 3. Frontend build & test (community access layer)
  # ---------------------------------------------------------------
  frontend:
    name: Frontend Build & Test
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check frontend directory exists
        id: check
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json not found yet — skipping frontend build."
          fi

      - name: Set up Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Run lint
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Run tests
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm test --if-present

      - name: Build production bundle
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

      - name: Upload build artifacts
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  # ---------------------------------------------------------------
  # 4. Data pipeline checks (risk-scoring R(c,t) implementation)
  # ---------------------------------------------------------------
  data-pipeline:
    name: Data Pipeline Tests
    needs: changes
    if: needs.changes.outputs.data_pipeline == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check data-pipeline directory exists
        id: check
        run: |
          if [ -d "data-pipeline" ] && [ -n "$(find data-pipeline -name '*.py' 2>/dev/null)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::data-pipeline has no Python files yet — skipping."
          fi

      - name: Set up Python
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: data-pipeline/requirements.txt

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: data-pipeline
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        if: steps.check.outputs.exists == 'true'
        working-directory: data-pipeline
        run: |
          if [ -d tests ]; then pytest tests/; else echo "No tests directory yet — skipping."; fi

  # ---------------------------------------------------------------
  # 5. Secret scanning — raw Gitleaks CLI (no license required)
  #    (non-blocking for initial test runs)
  # ---------------------------------------------------------------
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and run Gitleaks CLI (non-blocking)
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks detect --source . --verbose --redact || true
        # Runs the open-source CLI directly — free regardless of repo
        # visibility, no GitHub Marketplace Action license needed.

  # ---------------------------------------------------------------
  # 5b. Smart contract compile check (Casper, Rust/WASM)
  #     See contracts/casper/README.md. Unlike contracts/tron's Hardhat
  #     job, this can't be verified at all in the sandbox this suite was
  #     written in -- no wasm32-unknown-unknown Rust target is available
  #     there (rustup's installer domain isn't reachable, and apt
  #     doesn't package Rust cross-compile targets). This job is the
  #     first real verification the Casper contracts get; treat early
  #     failures here as expected first-pass feedback, the same way
  #     contracts/tron's Hardhat 3 migration took several CI round-trips
  #     to go green, not as a sign anything is unusually broken.
  # ---------------------------------------------------------------
  contracts-casper:
    name: Contract Logic Build (Casper / Rust)
    needs: changes
    if: needs.changes.outputs.contracts_casper == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Casper contracts exist
        id: check
        run: |
          if [ -f "contracts/casper/Cargo.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::contracts/casper has no Cargo.toml yet — skipping."
          fi

      - name: Install Rust toolchain
        if: steps.check.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        if: steps.check.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/casper/target
          key: ${{ runner.os }}-cargo-casper-${{ hashFiles('contracts/casper/**/Cargo.lock', 'contracts/casper/.cargo/config.toml') }}
          # No restore-keys fallback right now, deliberately: a fuzzy
          # prefix-match fallback would still restore a cache entry
          # built before the bulk-memory rustflag fix, which is exactly
          # what's suspected of causing the previous run's identical,
          # unchanged failure despite that real fix. Guarantees a fully
          # clean rebuild this round to know for certain whether the
          # flag actually works, at the cost of one slower CI run.
          # Re-add a restore-keys fallback once this is confirmed.

      - name: Build contracts (wasm32-unknown-unknown)
        if: steps.check.outputs.exists == 'true'
        working-directory: contracts/casper
        shell: bash
        run: |
          set -o pipefail
          # Scoped to -p risk-registry deliberately: risk-registry-tests
          # (this workspace's other member) depends on
          # casper-engine-test-support, which isn't wasm32-compatible --
          # building the whole workspace for this target would fail on
          # that package, not just risk-registry itself.
          if ! cargo build --release --target wasm32-unknown-unknown -p risk-registry 2>&1 | tee cargo-build-output.log; then
            # Same technique used to diagnose the Hardhat 3 migration:
            # raw job logs and artifact downloads both redirect through
            # an Azure Blob host outside this project's usual working
            # environment's network allowlist, so surface the real
            # compiler output via a workflow annotation instead, which
            # is reachable through the check-runs API.
            ENCODED=$(sed 's/\x1b\[[0-9;]*m//g' cargo-build-output.log | grep -B2 -A25 -E '^error' | sed 's/%/%25/g; s/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 9000)
            echo "::error::CASPER_BUILD_FAILURE_TAIL: ${ENCODED}"
            exit 1
          fi

      - name: Lower Wasm bulk-memory ops (Casper engine compatibility)
        if: steps.check.outputs.exists == 'true'
        working-directory: contracts/casper
        run: |
          # Rust's default codegen for wasm32-unknown-unknown can emit
          # "bulk memory operations" (memory.copy/memory.fill) -- e.g.
          # via the dlmalloc allocator, or LLVM's own optimizer under
          # LTO -- which Casper's execution engine rejects outright
          # during deploy validation:
          #   WasmPreprocessing(Deserialize("Bulk memory operations are
          #   not supported"))
          # This is a known, tracked ecosystem gap (see
          # casper-network/casper-node#4367: "Modern compilers i.e.
          # rust and golang are emitting these extensions by default"),
          # not something specific to this contract's code. Disabling
          # the target-feature at the rustc level (see
          # .cargo/config.toml) does NOT fix this: the actual bulk-memory
          # instructions can come from a prebuilt object blob bundled in
          # the Rust toolchain's own sysroot for this target, immune to
          # this crate's own rustflags (confirmed via
          # rust-lang/rust#140971, a real upstream issue about exactly
          # this).
          #
          # The fix instead: post-process the compiled .wasm with
          # Binaryen's wasm-opt --llvm-memory-copy-fill-lowering, which
          # rewrites memory.copy/memory.fill into equivalent byte-loop
          # instructions using only WASM MVP-compatible opcodes, and
          # clears the bulk-memory requirement from the output module.
          # Verified empirically against a synthetic test module before
          # relying on it here.
          #
          # This specific flag needs a newer Binaryen than what apt
          # currently ships (Ubuntu noble's binaryen package is v108;
          # the flag needs v109+) -- downloading the latest release
          # directly from GitHub instead.
          BINARYEN_VERSION=version_129
          curl -sL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" -o /tmp/binaryen.tar.gz
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          WASM_OPT="/tmp/binaryen-${BINARYEN_VERSION}/bin/wasm-opt"

          WASM_PATH="target/wasm32-unknown-unknown/release/risk-registry.wasm"
          "$WASM_OPT" "$WASM_PATH" --enable-bulk-memory --llvm-memory-copy-fill-lowering -Oz -o "$WASM_PATH"

      - name: Stage compiled Wasm for integration tests
        if: steps.check.outputs.exists == 'true'
        working-directory: contracts/casper
        run: |
          # casper-engine-test-support's ExecuteRequestBuilder looks for
          # compiled .wasm files in a conventional wasm/ dir relative to
          # the test binary's own package directory (the same convention
          # Casper's own tutorial Makefiles use) -- risk-registry-tests'
          # own directory now that tests live in that separate package,
          # not target/wasm32-unknown-unknown/release/ directly.
          mkdir -p risk-registry-tests/wasm
          cp target/wasm32-unknown-unknown/release/risk-registry.wasm risk-registry-tests/wasm/

      - name: Run native-target unit/integration tests
        if: steps.check.outputs.exists == 'true'
        working-directory: contracts/casper
        shell: bash
        run: |
          set -o pipefail
          # Scoped to -p risk-registry-tests deliberately: risk-registry
          # itself is #![no_std] with its own #[panic_handler], built
          # only for wasm32-unknown-unknown (see risk-registry/Cargo.toml's
          # comment) -- building it for the native host target, which
          # `cargo test` does for every workspace member by default,
          # collides with the native toolchain's own panic handler
          # (confirmed via a real CI error: "duplicate lang item
          # panic_impl"). risk-registry-tests never touches
          # risk-registry's own source -- it only loads the already-
          # compiled .wasm staged above.
          if ! cargo test --release -p risk-registry-tests 2>&1 | tee cargo-test-output.log; then
            ENCODED=$(sed 's/\x1b\[[0-9;]*m//g' cargo-test-output.log | grep -B2 -A25 -E '^error|panicked at' | sed 's/%/%25/g; s/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 9000)
            echo "::error::CASPER_TEST_FAILURE_TAIL: ${ENCODED}"
            exit 1
          fi

      - name: Upload compiled Wasm artifacts
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: casper-wasm-artifacts
          path: contracts/casper/target/wasm32-unknown-unknown/release/*.wasm

  # ---------------------------------------------------------------
  # 6. Summary job — single required status check for branch protection
  # ---------------------------------------------------------------
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [ changes, contracts-tron, contracts-test, contracts-lint, contracts-casper, frontend, data-pipeline, secret-scan ]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "Contracts changed:  ${{ needs.changes.outputs.contracts }}"
          echo "Contracts (TRON):   ${{ needs.contracts-tron.result }}"
          echo "Contracts tests:    ${{ needs.contracts-test.result }}"
          echo "Contracts lint:     ${{ needs.contracts-lint.result }}"
          echo "Contracts (Casper): ${{ needs.contracts-casper.result }}"
          echo "Frontend changed:   ${{ needs.changes.outputs.frontend }}"
          echo "Frontend:           ${{ needs.frontend.result }}"
          echo "Data pipeline:      ${{ needs.data-pipeline.result }}"
          echo "Secret scan:        ${{ needs.secret-scan.result }}"

          if [[ "${{ needs.contracts-tron.result }}" == "failure" ]] || \
             [[ "${{ needs.contracts-test.result }}" == "failure" ]] || \
             [[ "${{ needs.contracts-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.contracts-casper.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend.result }}" == "failure" ]] || \
             [[ "${{ needs.data-pipeline.result }}" == "failure" ]] || \
             [[ "${{ needs.secret-scan.result }}" == "failure" ]]; then
            echo "One or more jobs failed."
            exit 1
          fi
