name: OSSF Scorecard supply-chain security

# A real, independently-computed, GitHub-verifiable security posture
# score -- NOT a substitute for a professional smart-contract audit
# (see docs/audit-pass-2026-07-25.md and this suite's own README
# status notes, which still correctly say one is needed before real
# funds move). What Scorecard actually checks is supply-chain and
# repository hygiene: branch protection, pinned dependencies and
# GitHub Actions (by commit SHA, not a mutable tag), whether CI
# actually runs and blocks on failure, presence of a vulnerability
# disclosure policy, dependency update automation, and about a dozen
# other checks -- see https://github.com/ossf/scorecard#checks for the
# full, individually-documented list. Each check scores 0-10; OSSF
# publishes the exact scoring logic per check, so a score here is
# independently reproducible by anyone re-running the same open-source
# tool against this repo -- that reproducibility is what makes this
# "verifiable by GitHub" in a real sense, not just an internal claim.
#
# Results publish two ways, both inspectable without trusting this
# workflow's own summary:
#   1. SARIF upload to this repo's Security tab -> Code scanning
#      alerts, the same dashboard CodeQL results already land in.
#   2. publish_results: true sends the score to OSSF's own public API,
#      which is what enables the badge in README.md -- the badge image
#      is served by OSSF, not generated by this repo, so it can't be
#      locally faked into showing a better score than OSSF's own last
#      recorded run.
#
# Runs on push to main and weekly (Scorecard's own recommended
# cadence, since some checks -- e.g. Maintained -- depend on repo
# activity that changes independent of any single push).

on:
  push:
    branches: [main]
  schedule:
    # 03:00 UTC every Monday -- offset from security-audit.yml's daily
    # 02:00 UTC run so both don't contend for runner minutes at once.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

# Declared read-only at the workflow level; the one job that needs
# more elevates its own permissions explicitly below. Matches this
# repo's own d3rac-ci.yml/security-audit.yml convention.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF results to the Security tab.
      security-events: write
      # Required to publish results to OSSF's API (enables the badge).
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 -- SHA independently confirmed via a real GitHub Actions pin-check issue's generated text (esphome/esp-stacktrace-decoder#39), not asserted from memory.
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0 -- SHA independently confirmed across multiple real dependabot bump commits (nodejs/llhttp@e045cd2, ruby/ruby@cdda284), not asserted from memory.
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        # NOT SHA-pinned, unlike the other three steps in this file --
        # deliberately, not an oversight: this session searched for a
        # verifiable actions/upload-artifact v4 SHA and didn't find one
        # confirmed from an independent source (only newer v5/v7 SHAs
        # turned up), and would rather leave this on a tag honestly
        # than assert an unverified hash as fact. Whoever next touches
        # this file should pin it properly (see stepsecurity.io's
        # pinning guide, already used as the basis for the other three
        # pins here) rather than carry this gap forward silently.
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@2d92b76c45b91eb80fc44c74ce3fce0ee94e8f9d # v3.30.0 -- SHA independently confirmed via a real dependabot bump commit (fluent/fluentd@308b336), not asserted from memory.
        with:
          sarif_file: results.sarif
