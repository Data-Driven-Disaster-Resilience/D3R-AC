# Automated dependency-update PRs -- real, GitHub-native, independently
# verifiable (every PR Dependabot opens shows exactly what changed and
# why, sourced from the ecosystem's own advisory/release data, not
# anything this repo's own CI computes or could quietly skew).
#
# One entry per actual dependency manifest in this repo (found via
# `find . -iname Cargo.toml -o -iname package.json -o -iname
# pyproject.toml`, not assumed) plus github-actions itself, since
# every workflow in .github/workflows/ pins external actions and those
# need updates too -- see security-audit.yml and scorecard.yml's own
# comments on why pinned-by-SHA action versions matter.
#
# Weekly cadence everywhere, matching security-audit.yml's own daily-
# for-findings-but-weekly-for-real-review cadence reasoning: dependency
# bumps are lower-urgency than a live CVE finding (which cargo-audit/
# npm audit/pip-audit already catch same-day, independent of
# Dependabot), so weekly avoids PR-volume noise while still keeping
# every ecosystem current.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/contracts/casper"
    schedule:
      interval: "weekly"
    ignore:
      # casper-contract 5.1.1 requires casper-types "6.0.1" (Cargo caret
      # semantics: >=6.0.1, <7.0.0) -- confirmed against its own
      # published Cargo.toml, not assumed. Checked crates.io's
      # reverse-dependency listing for casper-types directly: as of
      # 2026-09, casper-contract, casper-engine-test-support (what
      # every *-tests package in this workspace uses), casper-node,
      # and casper-event-standard are ALL still capped at casper-types
      # ^6.x -- only casper-execution-engine and casper-client have
      # moved to ^7.0.0. A PR bumping just casper-types to 7.0.0 (#35)
      # confirmed this fails Contract Logic Build for exactly this
      # reason, not an import-path issue this repo could fix on its
      # own. Remove this ignore rule once casper-contract/
      # casper-engine-test-support/casper-event-standard themselves
      # support casper-types 7.x -- check manually periodically, since
      # Dependabot won't propose it again while this rule exists.
      - dependency-name: "casper-types"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/agents/node"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/contracts/tron"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/contracts/tron/tronbox"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/agents/python"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/data-pipeline"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
